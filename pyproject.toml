[project]
name = "voice-landscape"
version = "0.9.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-compressor>=4.6.0",
    "django-cors-headers>=4.9.0",
    "django-sass-processor>=1.4.2",
    "django-stubs>=6.0.4",
    "djangorestframework>=3.17.1",
    "libsass>=0.23.0",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "openai-whisper>=20250625",
    "pillow>=12.2.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "spacy>=3.8.14",
    "speechrecognition[whisper-local]>=3.16.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "django-extensions>=4.1",
    "django-types>=0.24.0",
    "pytest>=9.0.3",
]
lab = [
    "anywidget>=0.11.0",
    "marimo[mcp]>=0.23.6",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.99.0",
    "qrcode[pil]>=8.2",
    "ruff>=0.15.13",
    "traitlets>=5.15.0",
]
prod = [
    "gunicorn>=26.0.0",
]

[tool.basedpyright]
typeCheckingMode="standard"
reportIncompatibleVariableOverride=false
