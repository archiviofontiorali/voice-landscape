[project]
name = "voice-landscape"
version = "0.9.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "django-types>=0.24.0",
]
lab = [
    "anywidget>=0.11.0",
    "marimo[mcp]>=0.23.6",
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.99.0",
    "ruff>=0.15.13",
    "traitlets>=5.15.0",
]
prod = [
    "gunicorn>=26.0.0",
]
